services:
  # 1. Django REST API Backend Service
  - type: web
    name: aavedan-backend
    env: python
    plan: free
    region: singapore
    rootDir: Aavedan-Setu/backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aavedan-db
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: aavedan-ai
          property: host

  # 2. FastAPI AI Microservice (Groq / Vision / LLM Orchestrator)
  - type: web
    name: aavedan-ai
    env: python
    plan: free
    region: singapore
    rootDir: Aavedan-Setu/Ai
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

# 3. Managed PostgreSQL Database
databases:
  - name: aavedan-db
    plan: free
    region: singapore
    databaseName: aavedan_setu_db
    user: aavedan_user
